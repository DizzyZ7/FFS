<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FFS — Video Studio</title>
<style>
:root{font-family:system-ui;color-scheme:dark;background:#10121b;color:#e9eaf5}body{margin:0}header{padding:20px 32px;background:#191c2a;border-bottom:1px solid #34384d}main{max-width:1100px;margin:32px auto;padding:0 20px}.panel{background:#1a1e2b;padding:24px;border:1px solid #353b51;border-radius:18px;margin:18px 0}button{border:0;background:#8167ee;color:white;padding:12px 18px;border-radius:10px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input{margin:12px 0}video{width:100%;max-height:460px;background:#000;border-radius:12px}#clips{display:flex;gap:10px;flex-wrap:wrap}.clip{background:#30364a;padding:14px;border-radius:10px}.clip input{width:75px;background:#161925;color:white;border:1px solid #515a77;padding:6px}small{color:#a7afc5}a{color:#a9a0ff}#status{white-space:pre-wrap}#storyboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.shot{background:#252b3d;border:1px solid #404860;border-radius:12px;overflow:hidden}.shot img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0a0c14}.shot figcaption{padding:9px;font-size:12px;color:#c4c9df}.shot{margin:0}</style></head>
<body><header><strong>FFS / FrameForge Studio</strong> <small>v0.1 · Local-first reference editor</small></header>
<main><h1>Reference Studio</h1><p>Загрузи ролик, найди склейки, отредактируй последовательность сцен и экспортируй видео.</p>
<section class="panel"><h2>1. Исходное видео</h2><input id="file" type="file" accept="video/*"><button id="upload">Анализировать</button><p id="status" role="status"></p></section>
<section class="panel" id="editor" hidden><h2>2. Сцены</h2><video id="preview" controls></video><p id="metadata"></p><div id="clips"></div><p><button id="storyboard-button">Создать раскадровку</button></p><div id="storyboard" aria-live="polite"></div><p><button id="save">Сохранить монтаж</button> <button id="export">Экспортировать MP4</button></p><a id="download" hidden>Скачать результат</a></section>
</main><script>
let project=null;
const el=id=>document.getElementById(id);
function status(message){el('status').textContent=message}
el('upload').onclick=async()=>{
 const file=el('file').files[0];if(!file){status('Выбери видео');return}
 const body=new FormData();body.append('file',file);
 el('upload').disabled=true;status('Загружаем и анализируем видео...');
 try{const r=await fetch('/api/projects',{method:'POST',body});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data.detail));
 project=data;el('editor').hidden=false;el('preview').src='/api/projects/'+data.id+'/source';el('metadata').textContent='Длительность: '+data.metadata.duration.toFixed(1)+' с · '+data.metadata.width+'×'+data.metadata.height;
 const box=el('clips');box.replaceChildren();(data.timeline||data.scenes).forEach((clip,i)=>{const div=document.createElement('div');div.className='clip';div.innerHTML='<strong>Сцена '+(i+1)+'</strong><div>От <input type="number" step="0.01" class="start"> До <input type="number" step="0.01" class="end"></div><label><input type="checkbox" class="include" checked> Включить</label>';div.querySelector('.start').value=clip.start;div.querySelector('.end').value=clip.end;box.append(div)});
 el('storyboard').replaceChildren();el('download').hidden=true;status('Найдено сцен: '+data.scenes.length)
 }catch(e){status('Ошибка: '+e.message)}finally{el('upload').disabled=false}
};
el('storyboard-button').onclick=async()=>{
 if(!project)return;
 const button=el('storyboard-button');button.disabled=true;status('Создаем раскадровку...');
 try{
   const r=await fetch('/api/projects/'+project.id+'/storyboard',{method:'POST'});
   const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data.detail));
   const grid=el('storyboard');grid.replaceChildren();
   for(const frame of data.preview_frames){
     const shot=data.shots.find(s=>s.id===frame.shot_id);
     const figure=document.createElement('figure');figure.className='shot';
     const img=document.createElement('img');img.src=frame.url;img.alt='Кадр '+frame.shot_id;img.loading='lazy';
     const caption=document.createElement('figcaption');
     caption.textContent=frame.shot_id+' · '+shot.start.toFixed(2)+'–'+shot.end.toFixed(2)+' с';
     figure.append(img,caption);grid.append(figure);
   }
   status('Раскадровка готова: '+data.preview_frames.length+' кадров');
 }catch(e){status('Ошибка раскадровки: '+e.message)}
 finally{button.disabled=false}
};
function collectClips(){return [...document.querySelectorAll('.clip')].filter(x=>x.querySelector('.include').checked).map(x=>({start:Number(x.querySelector('.start').value),end:Number(x.querySelector('.end').value)}))}
el('save').onclick=async()=>{
 if(!project)return;
 el('save').disabled=true;
 try{const r=await fetch('/api/projects/'+project.id+'/timeline',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({clips:collectClips()})});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data.detail));status('Монтаж сохранен · ревизия '+data.revision)}catch(e){status('Ошибка сохранения: '+e.message)}finally{el('save').disabled=false}
};
el('export').onclick=async()=>{
 if(!project)return;
 const clips=collectClips();
 el('export').disabled=true;status('Рендеринг, подожди...');
 try{const r=await fetch('/api/projects/'+project.id+'/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clips})});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data.detail));el('download').href=data.download;el('download').hidden=false;el('download').textContent='Скачать MP4';status('Рендер готов')}catch(e){status('Ошибка: '+e.message)}finally{el('export').disabled=false}
};
</script></body></html>
