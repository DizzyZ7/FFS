name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 update
            sudo apt-get -o Acquire::Retries=2 install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check -r requirements.txt pytest httpx
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: FFmpeg integration smoke test
        run: python scripts/smoke_render.py
